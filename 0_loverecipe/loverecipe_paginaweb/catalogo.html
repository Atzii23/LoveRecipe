<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/catalogo.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Catalogo</title>
</head>

<body>

    <div class="partes_fuera">
        <div class="partes_dentro">
            <div class="mantelito">

                <div id="volver">
                    <a href="index.html"><i class="fas fa-angle-left"></i></a>
                </div>

                <nav>
                    <div class="barra_busqueda">
                        <input type="text" placeholder="Buscar receta...">

                        <div id="buscar">
                            <i class="fas fa-search"></i>
                        </div>
                    </div>
                </nav>

                <main id="contenedor_tarjetas">

                    <div class="tarjeta_receta">

                        <div class="tarjeta_imagen">

                            <div class="bookmark">
                                <i class="fas fa-bookmark"></i>
                            </div>

                            <img>

                        </div>

                        <div class="tarjeta_cuerpo">

                            <div class="titulo_tarjeta">
                                <h3>Titulo</h3>
                            </div>

                            <div class="descripcion_tarjeta">Descripcion</div>

                        </div>

                        <div class="tarjeta_herramientas">

                            <div class="estrellas">
                                <span class="estrella" data-value="1">&#9733;</span>
                                <span class="estrella" data-value="2">&#9733;</span>
                                <span class="estrella" data-value="3">&#9733;</span>
                                <span class="estrella" data-value="4">&#9733;</span>
                                <span class="estrella" data-value="5">&#9733;</span>
                            </div>

                            <div class="acciones_iconos">

                                <div class="editar">
                                    <i class="fas fa-pen"></i>
                                </div>

                                <div class="eliminar">
                                    <i class="fas fa-trash-alt"></i>
                                </div>

                            </div>

                        </div>

                    </div>

                </main>
            </div>
        </div>
    </div>

    <script src="js/conectar_api.js"></script>
    <script src="js/catalogo.js"></script>
</body>

</html>
